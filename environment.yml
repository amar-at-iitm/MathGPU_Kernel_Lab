name: mathgpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch>=2.6.0
  - torchvision>=0.21.0
  - torchaudio>=2.6.0
  - pytorch-cuda=12.4
  - numpy>=2.0.0
  - scipy>=1.14.0
  - pandas>=2.2.0
  - matplotlib>=3.9.0
  - pytest>=8.0.0
  - ninja
  - pip
  - pip:
      - tabulate>=0.9.0
      - optuna>=3.6.0
