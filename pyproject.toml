[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathgpu-kernel-lab"
version = "0.1.0"
description = "Mathematical Optimization of GPU Tensor Kernels for Scientific and AI Computing"
readme = "README.md"
authors = [{ name = "MathGPU Lab Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "optuna>=3.6.0",
    "tabulate>=0.9.0",
    "ninja>=1.11.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
